spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# the Supabase session pooler allows 15 connections for everyone together, the default 10 per backend runs out with two
spring.datasource.hikari.maximum-pool-size=4

# schema is managed in supabase/migrations, hibernate must not touch it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}

s3.endpoint=${S3_ENDPOINT}
s3.region=${S3_REGION}
s3.public-url=${S3_PUBLIC_URL}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

app.cors.origins=http://localhost:5173
